<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#ffffff"/>

 
  <line x1="50" y1="550" x2="750" y2="550" stroke="#333" stroke-width="4"/>
  <text x="400" y="580" font-size="18" text-anchor="middle" fill="#333">Sol (y = 0 physique)</text>
  <line x1="50" y1="80" x2="750" y2="80" stroke="#999" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="60" font-size="16" text-anchor="middle" fill="#999">Plafond (2,50 m)</text>


  <line x1="50" y1="80" x2="50" y2="550" stroke="#333" stroke-width="4"/>
  <line x1="750" y1="80" x2="750" y2="550" stroke="#333" stroke-width="4"/>

  <circle cx="250" cy="200" r="25" fill="#4a90d9"/>
  <line x1="250" y1="225" x2="250" y2="400" stroke="#4a90d9" stroke-width="10" stroke-linecap="round"/>
  <line x1="250" y1="270" x2="200" y2="330" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="270" x2="300" y2="330" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="400" x2="220" y2="550" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="400" x2="280" y2="550" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  <text x="250" y="440" font-size="14" text-anchor="middle" fill="#4a90d9">Utilisateur</text>


  <circle cx="250" cy="200" r="6" fill="#e04040"/>
  <text x="330" y="195" font-size="15" fill="#e04040" font-weight="bold">VIEW</text>
  <text x="330" y="213" font-size="12" fill="#e04040">(entre les yeux, suit la tete)</text>

  <circle cx="250" cy="200" r="14" fill="none" stroke="#40a040" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="330" y="230" font-size="15" fill="#40a040" font-weight="bold">LOCAL</text>
  <text x="330" y="248" font-size="12" fill="#40a040">(pose initiale, fixe, alignee gravite)</text>


  <circle cx="250" cy="550" r="6" fill="#8040c0"/>
  <text x="330" y="545" font-size="15" fill="#8040c0" font-weight="bold">STAGE</text>
  <text x="330" y="563" font-size="12" fill="#8040c0">(au sol, centre de la zone)</text>


  <rect x="550" y="375" width="120" height="8" fill="#8040c0"/>
  <line x1="560" y1="383" x2="560" y2="550" stroke="#8040c0" stroke-width="3"/>
  <line x1="660" y1="383" x2="660" y2="550" stroke="#8040c0" stroke-width="3"/>
  <text x="610" y="368" font-size="13" text-anchor="middle" fill="#8040c0">Table via STAGE : hauteur correcte</text>

  <rect x="550" y="30" width="120" height="8" fill="#e04040"/>
  <text x="610" y="20" font-size="13" text-anchor="middle" fill="#e04040">Table via VIEW ou LOCAL : en l'air, hors de la piece !</text>
  <line x1="610" y1="38" x2="610" y2="80" stroke="#e04040" stroke-width="2" stroke-dasharray="4,3"/>


  <line x1="500" y1="380" x2="500" y2="550" stroke="#666" stroke-width="1.5"/>
  <text x="470" y="470" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 470 470)">0,80 m</text>

  <text x="400" y="595" font-size="13" text-anchor="middle" fill="#333" font-style="italic">
    Meme valeur (0,80 m), trois resultats : seul STAGE place la table au sol de facon physique.
  </text>
</svg>